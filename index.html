    Design direction
    THESIS: a preparedness library where every title is a crisis you practise by making choices; refuses passive "watch" framing.

    STORY: visitor sees a featured crisis, understands they practise it by choosing, browses hazards, signs in once, plays.
    FIRST VIEWPORT: full-bleed Storm Alert key art + title, one orange Play action; slow zoom.
    -->
